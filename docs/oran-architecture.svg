<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
</defs>
<rect width="1400" height="940" fill="#ffffff"/>
<text x="700" y="26" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">O-RAN logical architecture and interfaces involved in the RLF experiment</text>

<!-- SMO -->
<rect x="40" y="45" width="1320" height="180" rx="12" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="2"/>
<text x="60" y="70" font-size="16" font-weight="bold" fill="#4b2fa0">SMO – Service Management and Orchestration</text>
<rect x="80" y="90" width="340" height="110" rx="8" fill="#fff" stroke="#6b4fbb"/>
<text x="250" y="122" text-anchor="middle" font-size="16" font-weight="bold">Non-RT RIC</text>
<text x="250" y="146" text-anchor="middle" font-size="13">rApps · control loops &gt; 1 s</text>
<text x="250" y="168" text-anchor="middle" font-size="13">policies, ML model management</text>
<rect x="470" y="90" width="430" height="110" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="685" y="122" text-anchor="middle" font-size="16" font-weight="bold">Data collection and ML platform</text>
<text x="685" y="146" text-anchor="middle" font-size="13">ingests O1 (PM / FM / traces) + E2 data stores</text>
<text x="685" y="168" text-anchor="middle" font-size="13">feature building · training · MLflow tracking and registry</text>
<rect x="950" y="90" width="370" height="110" rx="8" fill="#fff" stroke="#6b4fbb"/>
<text x="1135" y="122" text-anchor="middle" font-size="16" font-weight="bold">O1 / O2 functions</text>
<text x="1135" y="146" text-anchor="middle" font-size="13">FCAPS management (O1)</text>
<text x="1135" y="168" text-anchor="middle" font-size="13">cloud / resource orchestration (O2)</text>

<!-- Near RT RIC -->
<rect x="480" y="290" width="440" height="90" rx="10" fill="#e8f1fb" stroke="#1f6fbf" stroke-width="2"/>
<text x="700" y="325" text-anchor="middle" font-size="17" font-weight="bold">Near-RT RIC</text>
<text x="700" y="350" text-anchor="middle" font-size="13">xApps · control loops 10 ms – 1 s · E2 termination</text>

<!-- A1 -->
<path d="M250 200 L250 335 L480 335" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="262" y="320" font-size="15" font-weight="bold">A1</text>
<text x="262" y="354" font-size="12" fill="#555">policies, ML models, enrichment</text>

<!-- O-Cloud frame -->
<rect x="40" y="430" width="1060" height="185" rx="12" fill="#f7fbf7" stroke="#4a9a4a" stroke-width="2" stroke-dasharray="8 5"/>
<text x="1085" y="452" text-anchor="end" font-size="14" font-weight="bold" fill="#2f7a2f">O-Cloud</text>

<rect x="80" y="475" width="200" height="85" rx="8" fill="#fff" stroke="#1f6fbf" stroke-width="2"/>
<text x="180" y="508" text-anchor="middle" font-size="16" font-weight="bold">O-CU-CP</text>
<text x="180" y="530" text-anchor="middle" font-size="12">RRC · PDCP-C · RRC events</text>
<rect x="340" y="475" width="200" height="85" rx="8" fill="#fff" stroke="#1f6fbf" stroke-width="2"/>
<text x="440" y="508" text-anchor="middle" font-size="16" font-weight="bold">O-CU-UP</text>
<text x="440" y="530" text-anchor="middle" font-size="12">SDAP · PDCP-U</text>
<rect x="760" y="475" width="220" height="85" rx="8" fill="#fff" stroke="#1f6fbf" stroke-width="2"/>
<text x="870" y="508" text-anchor="middle" font-size="16" font-weight="bold">O-DU</text>
<text x="870" y="530" text-anchor="middle" font-size="12">RLC · MAC · high-PHY · scheduler</text>
<text x="870" y="548" text-anchor="middle" font-size="12">(BLER, HARQ, TA, PHR)</text>

<!-- E1 -->
<path d="M280 517 L340 517" stroke="#444" stroke-width="2"/>
<text x="310" y="508" text-anchor="middle" font-size="14" font-weight="bold">E1</text>
<!-- F1 -->
<path d="M150 560 L150 580 L840 580 L840 560" fill="none" stroke="#444" stroke-width="2"/>
<text x="500" y="574" font-size="13" font-weight="bold">F1-c</text>
<path d="M410 560 L410 602 L900 602 L900 560" fill="none" stroke="#444" stroke-width="2"/>
<text x="650" y="598" font-size="13" font-weight="bold">F1-u</text>

<!-- E2 -->
<path d="M600 380 L600 410 L180 410 L180 475" fill="none" stroke="#e08a00" stroke-width="3.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M800 380 L800 410 L870 410 L870 475" fill="none" stroke="#e08a00" stroke-width="3.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="195" y="402" font-size="16" font-weight="bold" fill="#b86e00">E2</text>
<text x="835" y="403" font-size="16" font-weight="bold" fill="#b86e00">E2</text>
<text x="225" y="402" font-size="12" fill="#b86e00">E2SM-KPM (reports) · E2SM-RC (control)</text>

<!-- O2 -->
<path d="M60 225 L60 430" fill="none" stroke="#2f7a2f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="72" y="330" font-size="15" font-weight="bold" fill="#2f7a2f">O2</text>

<!-- O-RU -->
<rect x="760" y="690" width="220" height="80" rx="8" fill="#fff" stroke="#1f6fbf" stroke-width="2"/>
<text x="870" y="722" text-anchor="middle" font-size="16" font-weight="bold">O-RU</text>
<text x="870" y="745" text-anchor="middle" font-size="12">low-PHY · RF · antennas</text>
<path d="M870 560 L870 690" stroke="#444" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)" transform="translate(0,0)"/>
<text x="888" y="632" font-size="12" font-weight="bold">Open Fronthaul (7.2x)</text>
<text x="888" y="649" font-size="12" fill="#555">C/U/S-plane + M-plane</text>

<!-- UE -->
<rect x="760" y="850" width="220" height="62" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="870" y="877" text-anchor="middle" font-size="16" font-weight="bold">UE</text>
<text x="870" y="897" text-anchor="middle" font-size="12">RRC measurement reports, RLF reports</text>
<path d="M870 770 L870 850" stroke="#444" stroke-width="2.5" stroke-dasharray="3 5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="888" y="815" font-size="14" font-weight="bold">Uu (radio)</text>

<!-- O1 bus -->
<path d="M1135 200 L1135 225" stroke="#c0392b" stroke-width="3"/>
<path d="M1135 225 L1135 730 L980 730" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#a)"/>
<path d="M1135 335 L920 335" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#a)"/>
<path d="M1135 440 L240 440 L240 475" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#a)"/>
<path d="M440 440 L440 475" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#a)"/>
<path d="M1135 515 L980 515" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#a)"/>
<text x="1150" y="400" font-size="16" font-weight="bold" fill="#c0392b">O1</text>
<text x="1150" y="420" font-size="12" fill="#c0392b">PM / FM / config /</text>
<text x="1150" y="436" font-size="12" fill="#c0392b">trace streaming to every</text>
<text x="1150" y="452" font-size="12" fill="#c0392b">managed element</text>

<!-- Neighbour / core note -->
<rect x="1150" y="770" width="210" height="142" rx="8" fill="#fafafa" stroke="#bbb"/>
<text x="1165" y="792" font-size="12" font-weight="bold">Also on the O-CU (not drawn):</text>
<text x="1165" y="812" font-size="12">NG-c / NG-u → 5G core</text>
<text x="1165" y="830" font-size="12">Xn → neighbouring gNBs</text>
<text x="1165" y="856" font-size="12" font-weight="bold">Mobility context:</text>
<text x="1165" y="874" font-size="12">handovers and A3 events are</text>
<text x="1165" y="892" font-size="12">visible at the CU and DU.</text>

<!-- Legend -->
<rect x="40" y="650" width="640" height="262" rx="10" fill="#fff" stroke="#bbb"/>
<text x="60" y="680" font-size="16" font-weight="bold">Where the RLF experiment data comes from</text>
<path d="M60 702 L120 702" stroke="#e08a00" stroke-width="3.5"/>
<text x="132" y="707" font-size="13"><tspan font-weight="bold">E2</tspan> – per-UE / per-cell KPM reports from O-CU and O-DU (near-RT RIC)</text>
<path d="M60 730 L120 730" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 5"/>
<text x="132" y="735" font-size="13"><tspan font-weight="bold">O1</tspan> – PM counters, FM alarms, config, trace files via the SMO</text>
<path d="M60 758 L120 758" stroke="#2f7a2f" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="132" y="763" font-size="13"><tspan font-weight="bold">O2</tspan> – infrastructure / O-Cloud management (not a KPI source)</text>
<path d="M60 786 L120 786" stroke="#444" stroke-width="2"/>
<text x="132" y="791" font-size="13"><tspan font-weight="bold">A1, E1, F1, Open FH</tspan> – other standard interfaces (see table in README)</text>
<path d="M60 814 L120 814" stroke="#444" stroke-width="2.5" stroke-dasharray="3 5"/>
<text x="132" y="819" font-size="13"><tspan font-weight="bold">Uu</tspan> – air interface; UE reports travel over it as RRC messages</text>
<text x="60" y="852" font-size="12" fill="#444">Highlighted in orange: the ML platform that consumes the data, trains the</text>
<text x="60" y="870" font-size="12" fill="#444">RLF models (MLflow) and can deploy them as rApps (Non-RT RIC) or xApps (near-RT RIC).</text>
<text x="60" y="896" font-size="11" fill="#777">Simplified logical view based on the O-RAN Alliance architecture; not every deployment exposes every interface.</text>
</svg>
