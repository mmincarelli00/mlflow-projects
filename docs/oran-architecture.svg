.n rect{stroke:#7d8a98;stroke-width:1}
.n .t{font-size:15px;font-weight:bold;fill:#17212c}
.n .s{font-size:12px;fill:#5a6775}
.ric rect.b{fill:#ecebfb} .ran rect.b{fill:#e6f2f0} .ext rect.b{fill:#ffffff}
.lk{fill:none;stroke-width:2.6;stroke-linejoin:round}
.f-oran .lk{stroke:#5546c2} .f-o1 .lk{stroke:#bf332c;stroke-width:2.2;stroke-dasharray:7 4} .f-e2 .lk{stroke:#b86200} .f-gpp .lk{stroke:#0d7468}
.f-oran text{fill:#5546c2} .f-o1 text{fill:#bf332c} .f-e2 text{fill:#b86200} .f-gpp text{fill:#0d7468}
.ll{font-family:Menlo, Consolas, monospace;font-size:12.5px;font-weight:bold}
.e2n rect{fill:#ffffff;stroke:#b86200;stroke-width:1.2}.e2n text{fill:#b86200;font-family:Menlo, Consolas, monospace;font-size:10.5px;font-weight:bold}
</style>
