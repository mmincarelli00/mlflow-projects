<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1170" width="1400" height="1170" role="img" aria-labelledby="mt md">
<title id="mt">O-RAN architecture and interfaces</title>
<desc id="md">SMO with rApps and Non-RT RIC (R1), O1 dashed lines from the SMO to the Near-RT RIC, O-CU-CP, O-CU-UP, O-DU, O-RU and O-eNB, A1 down to the Near-RT RIC. The O-Cloud spans an edge site hosting the Near-RT RIC, O-CU-CP and O-CU-UP, and a far-edge site hosting the O-DU, managed by the SMO over O2 through IMS and DMS. E2 from the Near-RT RIC to the CU-CP, CU-UP and DU, Y1 to external users, O1 to every managed element. E1 between CU-CP and CU-UP, F1-C and F1-U from the edge site to the far-edge site, Open Fronthaul to the physical O-RU, Uu to the UE, NG-C and NG-U to the 5G core, Xn-C and Xn-U to a neighbor gNB and X2 to an O-eNB.</desc>
