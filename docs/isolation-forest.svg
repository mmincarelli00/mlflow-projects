<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="780" fill="#ffffff"/>
<text x="700" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">Isolation Forest: isolate each row with random splits; short path = anomaly</text>
<!-- panel 1 -->
<text x="60" y="88" font-size="19" font-weight="700" fill="#1f2937">1. Learning: random splits on a sample of normal rows</text>
<text x="60" y="110" font-size="14" fill="#4b5563">Illustration with 2 of the 105 features. Each tree repeats this on its own random sample.</text>
<rect x="60" y="130" width="600" height="430" fill="#f9fafb" stroke="#9ca3af"/>
<circle cx="325" cy="426" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="269" cy="415" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="306" cy="358" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="424" cy="377" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="318" cy="403" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="382" cy="369" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="352" cy="326" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="300" cy="350" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="247" cy="302" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="231" cy="359" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="311" cy="356" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="324" cy="310" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="316" cy="381" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="361" cy="332" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="298" cy="279" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="292" cy="271" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="242" cy="420" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="199" cy="406" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="338" cy="356" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="345" cy="394" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="377" cy="360" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="287" cy="343" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="266" cy="368" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="277" cy="418" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="217" cy="321" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="268" cy="276" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="425" cy="262" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="304" cy="346" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="411" cy="281" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="379" cy="337" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="311" cy="340" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="355" cy="319" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="316" cy="386" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="421" cy="262" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="404" cy="413" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="293" cy="384" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="294" cy="444" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="332" cy="360" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="307" cy="361" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="310" cy="330" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="433" cy="284" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="312" cy="387" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="309" cy="363" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="338" cy="414" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="295" cy="353" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="427" cy="394" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="266" cy="475" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="363" cy="343" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="255" cy="383" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="274" cy="322" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="249" cy="347" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="381" cy="350" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="240" cy="400" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="324" cy="408" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="386" cy="362" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="312" cy="368" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="258" cy="400" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="395" cy="378" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="307" cy="358" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="277" cy="334" r="4.5" fill="#6b7a90" opacity=".75"/><circle cx="330" cy="380" r="4.5" fill="#6b7a90" opacity=".75"/>
<circle cx="560" cy="200" r="7" fill="#dc2626"/>
<text x="572" y="190" font-size="14" font-weight="700" fill="#dc2626">unusual row</text>
<circle cx="330" cy="380" r="9" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="272" y="520" font-size="14" font-weight="700" fill="#2563eb">typical row</text>
<g stroke="#111827" stroke-width="2" stroke-dasharray="7 4">
<line x1="470" y1="130" x2="470" y2="560"/>
<line x1="60" y1="300" x2="470" y2="300"/>
<line x1="390" y1="300" x2="390" y2="560"/>
<line x1="260" y1="300" x2="260" y2="560"/>
<line x1="260" y1="420" x2="390" y2="420"/>
</g>
<g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="470" cy="148" r="11" fill="#111827"/><text x="470" y="153">1</text>
<circle cx="90" cy="300" r="11" fill="#111827"/><text x="90" y="305">2</text>
<circle cx="390" cy="545" r="11" fill="#111827"/><text x="390" y="550">3</text>
<circle cx="260" cy="545" r="11" fill="#111827"/><text x="260" y="550">4</text>
<circle cx="325" cy="420" r="11" fill="#111827"/><text x="325" y="425">5</text>
</g>
<text x="360" y="586" font-size="14" fill="#4b5563" text-anchor="middle">feature A (for example rsrp_slope_5s)</text>
<text x="30" y="345" font-size="14" fill="#4b5563" transform="rotate(-90 30 345)" text-anchor="middle">feature B</text>
<text x="60" y="624" font-size="15" fill="#1f2937"><tspan font-weight="700" fill="#dc2626">Unusual row:</tspan> alone after 1 split, so a short path.</text>
<text x="60" y="648" font-size="15" fill="#1f2937"><tspan font-weight="700" fill="#2563eb">Typical row:</tspan> still sharing its region with other rows after 5 splits,</text>
<text x="60" y="670" font-size="15" fill="#1f2937">so it needs many more splits: a long path.</text>
<text x="60" y="706" font-size="15" fill="#1f2937">At each node a tree picks a random feature and a random split value between the</text>
<text x="60" y="728" font-size="15" fill="#1f2937">minimum and maximum of that node. Nothing is optimized, and labels are not used.</text>
<!-- panel 2 -->
<text x="720" y="88" font-size="19" font-weight="700" fill="#1f2937">2. One tree and the path of each row</text>
<rect x="720" y="130" width="640" height="300" fill="#f9fafb" stroke="#9ca3af"/>
<g stroke="#6b7280" stroke-width="2" fill="none">
<line x1="1040" y1="165" x2="900" y2="225"/><line x1="1040" y1="165" x2="1180" y2="225"/>
<line x1="900" y1="225" x2="820" y2="285"/><line x1="900" y1="225" x2="980" y2="285"/>
<line x1="820" y1="285" x2="770" y2="345"/><line x1="820" y1="285" x2="870" y2="345"/>
<line x1="770" y1="345" x2="745" y2="395" stroke-dasharray="4 4"/><line x1="770" y1="345" x2="795" y2="395" stroke-dasharray="4 4"/>
</g>
<g stroke="#111827" stroke-width="2" fill="#fff">
<circle cx="1040" cy="165" r="17"/><circle cx="900" cy="225" r="17"/><circle cx="820" cy="285" r="17"/><circle cx="770" cy="345" r="17"/>
</g>
<rect x="1162" y="209" width="36" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<rect x="962" y="269" width="36" height="32" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<rect x="852" y="329" width="36" height="32" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>

<text x="1040" y="171" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">1</text>
<text x="900" y="231" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">2</text>
<text x="820" y="291" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">3</text>
<text x="770" y="351" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">4</text>
<text x="1180" y="268" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">Unusual row: alone</text>
<text x="1180" y="287" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">path length h = 1</text>
<text x="880" y="385" font-size="14" font-weight="700" fill="#2563eb">Typical row: the path continues</text>
<text x="880" y="404" font-size="14" font-weight="700" fill="#2563eb">deeper, so h is large</text>
<text x="720" y="110" font-size="14" fill="#4b5563">Each circle is a random split (feature, value). Squares are leaves.</text>
<!-- panel 3 -->
<text x="720" y="470" font-size="19" font-weight="700" fill="#1f2937">3. Scoring: average path length over the 200 trees</text>
<text x="720" y="504" font-size="16" fill="#111827">E[h(x)] = mean path length of row x over the trees</text>
<text x="720" y="530" font-size="16" fill="#111827">c(n) = average path length for n = 256 rows, about 10.2</text>
<text x="720" y="560" font-size="17" font-weight="700" fill="#111827">anomaly score = 2 ^ ( - E[h(x)] / c(n) )</text>
<text x="720" y="584" font-size="14" fill="#4b5563">(the code returns the negative of scikit-learn's score_samples, which is this value)</text>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset=".5" stop-color="#e5e7eb"/><stop offset="1" stop-color="#f87171"/></linearGradient></defs>
<rect x="720" y="610" width="640" height="26" rx="4" fill="url(#g)" stroke="#9ca3af"/>
<g font-size="14" fill="#111827" text-anchor="middle">
<text x="720" y="660" text-anchor="start">0.44</text><text x="720" y="680" font-size="13" fill="#4b5563" text-anchor="start">E[h] = 12: long path, normal</text>
<text x="1040" y="660">0.50</text><text x="1040" y="680" font-size="13" fill="#4b5563">E[h] = c(n) = 10.2: borderline</text>
<text x="1360" y="660" text-anchor="end">0.87</text><text x="1360" y="680" font-size="13" fill="#4b5563" text-anchor="end">E[h] = 2: short path, anomalous</text>
</g>
<text x="720" y="722" font-size="15" fill="#1f2937">Higher score = more anomalous. Only the ranking of rows matters here,</text>
<text x="720" y="744" font-size="15" fill="#1f2937">because the alert threshold comes from TARGET_FPR, not from 0.5.</text>
</svg>