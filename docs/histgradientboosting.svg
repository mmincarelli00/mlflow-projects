<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,1 L13,7 L0,13 z" fill="#374151"/></marker>
<marker id="ar2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,1 L13,7 L0,13 z" fill="#6366f1"/></marker></defs><rect width="1400" height="820" fill="#ffffff"/>
<text x="700" y="40" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">HistGradientBoosting: how it learns</text>
<text x="40" y="66" font-size="17" font-weight="400" fill="#4b5563" text-anchor="start">Gradient boosting learning loop: many small trees, each correcting the errors of the previous ones</text>
<rect x="40" y="130" width="236" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="54" y="158" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">1. Start</text>
<text x="54" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Constant starting score F0,</text>
<text x="54" y="202" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">the same for every row, set</text>
<text x="54" y="222" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">from the class balance of the</text>
<text x="54" y="242" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">training data</text>
<line x1="279" y1="190.0" x2="307" y2="190.0" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="311" y="130" width="236" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="325" y="158" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">2. Errors</text>
<text x="325" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">For each row, p - y, where p =</text>
<text x="325" y="202" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">sigmoid(score) and y = label</text>
<text x="325" y="222" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">(0 or 1)</text>
<line x1="550" y1="190.0" x2="578" y2="190.0" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="582" y="130" width="236" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="596" y="158" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">3. New tree</text>
<text x="596" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Fit a small tree to these</text>
<text x="596" y="202" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">errors, using histogram bins</text>
<text x="596" y="222" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">as split candidates</text>
<line x1="821" y1="190.0" x2="849" y2="190.0" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="853" y="130" width="236" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="867" y="158" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">4. Update</text>
<text x="867" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">score = score + 0.05 x tree</text>
<text x="867" y="202" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">output (learning_rate = 0.05)</text>
<line x1="1092" y1="190.0" x2="1120" y2="190.0" stroke="#374151" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1124" y="130" width="236" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="1138" y="158" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">5. Result</text>
<text x="1138" y="182" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">After 300 trees: probability p</text>
<text x="1138" y="202" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">= sigmoid(F0 + sum of 300</text>
<text x="1138" y="222" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">scaled trees)</text>
<path d="M 971.0 130 V 104 H 429.0 V 127" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ar2)"/>
<text x="700.0" y="97" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">repeat 300 times (n_estimators / max_iter = 300)</text>
<text x="40" y="285" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Score of two rows as trees are added (illustrative)</text>
<rect x="100" y="330" width="540" height="300" fill="#f9fafb" stroke="#9ca3af"/>
<line x1="100" y1="630" x2="640" y2="630" stroke="#e5e7eb"/>
<text x="90" y="635" font-size="13" font-weight="400" fill="#4b5563" text-anchor="end">0</text>
<line x1="100" y1="555.0" x2="640" y2="555.0" stroke="#e5e7eb"/>
<text x="90" y="560.0" font-size="13" font-weight="400" fill="#4b5563" text-anchor="end">0.25</text>
<line x1="100" y1="480.0" x2="640" y2="480.0" stroke="#e5e7eb"/>
<text x="90" y="485.0" font-size="13" font-weight="400" fill="#4b5563" text-anchor="end">0.5</text>
<line x1="100" y1="405.0" x2="640" y2="405.0" stroke="#e5e7eb"/>
<text x="90" y="410.0" font-size="13" font-weight="400" fill="#4b5563" text-anchor="end">0.75</text>
<line x1="100" y1="330" x2="640" y2="330" stroke="#e5e7eb"/>
<text x="90" y="335" font-size="13" font-weight="400" fill="#4b5563" text-anchor="end">1</text>
<text x="100.0" y="652" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">0</text>
<text x="280.0" y="652" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">100</text>
<text x="460.0" y="652" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">200</text>
<text x="640.0" y="652" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle">300</text>
<text x="370.0" y="674" font-size="14" font-weight="400" fill="#4b5563" text-anchor="middle">number of trees added</text>
<text x="45" y="480.0" font-size="14" fill="#4b5563" transform="rotate(-90 45 480.0)" text-anchor="middle">predicted probability p</text>
<polyline points="100.0,614.4 109.0,607.0 118.0,597.3 127.0,585.3 136.0,571.1 145.0,555.0 154.0,537.5 163.0,519.5 172.0,501.5 181.0,484.1 190.0,467.8 199.0,452.9 208.0,439.5 217.0,427.6 226.0,417.2 235.0,408.1 244.0,400.2 253.0,393.3 262.0,387.4 271.0,382.3 280.0,377.8 289.0,374.0 298.0,370.6 307.0,367.7 316.0,365.2 325.0,362.9 334.0,360.9 343.0,359.2 352.0,357.6 361.0,356.3 370.0,355.0 379.0,354.0 388.0,353.0 397.0,352.1 406.0,351.3 415.0,350.6 424.0,350.0 433.0,349.4 442.0,348.8 451.0,348.4 460.0,347.9 469.0,347.5 478.0,347.2 487.0,346.8 496.0,346.5 505.0,346.3 514.0,346.0 523.0,345.8 532.0,345.6 541.0,345.4 550.0,345.2 559.0,345.0 568.0,344.9 577.0,344.7 586.0,344.6 595.0,344.5 604.0,344.4 613.0,344.3 622.0,344.2 631.0,344.1 640.0,344.0" fill="none" stroke="#dc2626" stroke-width="3.5"/>
<polyline points="100.0,614.4 109.0,617.3 118.0,619.6 127.0,621.4 136.0,622.7 145.0,623.8 154.0,624.7 163.0,625.4 172.0,626.0 181.0,626.4 190.0,626.8 199.0,627.1 208.0,627.4 217.0,627.6 226.0,627.8 235.0,628.0 244.0,628.1 253.0,628.3 262.0,628.4 271.0,628.5 280.0,628.6 289.0,628.6 298.0,628.7 307.0,628.8 316.0,628.8 325.0,628.9 334.0,628.9 343.0,628.9 352.0,629.0 361.0,629.0 370.0,629.0 379.0,629.0 388.0,629.1 397.0,629.1 406.0,629.1 415.0,629.1 424.0,629.1 433.0,629.2 442.0,629.2 451.0,629.2 460.0,629.2 469.0,629.2 478.0,629.2 487.0,629.2 496.0,629.2 505.0,629.2 514.0,629.2 523.0,629.2 532.0,629.3 541.0,629.3 550.0,629.3 559.0,629.3 568.0,629.3 577.0,629.3 586.0,629.3 595.0,629.3 604.0,629.3 613.0,629.3 622.0,629.3 631.0,629.3 640.0,629.3" fill="none" stroke="#2563eb" stroke-width="3.5"/>
<text x="632" y="402" font-size="14" font-weight="700" fill="#dc2626" text-anchor="end">row with an RLF ahead (y = 1): p rises</text>
<text x="632" y="614" font-size="14" font-weight="700" fill="#2563eb" text-anchor="end">normal row (y = 0): p falls</text>
<text x="40" y="710" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">At 0 trees every row has the same starting p. Each tree then moves the score only a</text>
<text x="40" y="730" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">little (learning rate 0.05), and is fitted to what the previous trees still get wrong.</text>
<text x="720" y="285" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">What is specific to HistGradientBoosting</text>
<rect x="720" y="300" width="640" height="480" fill="#f9fafb" stroke="#9ca3af"/>
<text x="740" y="330" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">a) Histogram binning: feature values grouped into at most 255 bins</text>
<rect x="760" y="450" width="33" height="20" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="796" y="436" width="33" height="34" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="832" y="415" width="33" height="55" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="868" y="390" width="33" height="80" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="904" y="366" width="33" height="104" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="940" y="352" width="33" height="118" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="976" y="374" width="33" height="96" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="1012" y="400" width="33" height="70" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="1048" y="422" width="33" height="48" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="1084" y="440" width="33" height="30" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="1120" y="450" width="33" height="20" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="1156" y="458" width="33" height="12" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="1192" y="462" width="33" height="8" fill="#93c5fd" stroke="#3b82f6"/>
<rect x="1228" y="465" width="33" height="5" fill="#93c5fd" stroke="#3b82f6"/>
<line x1="760" y1="470" x2="1264" y2="470" stroke="#374151"/>
<line x1="1082.5" y1="340" x2="1082.5" y2="476" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 3"/>
<text x="1088.5" y="352" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start">best split = a bin edge</text>
<text x="760" y="496" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">feature value (for example dl_bler_mean_5s), cut into bins; the tree tests only bin edges</text>
<text x="740" y="535" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">b) Leaf-wise growth: always split the leaf with the largest gain</text>
<line x1="1010" y1="568" x2="930" y2="612" stroke="#6b7280" stroke-width="2"/>
<line x1="1010" y1="568" x2="1090" y2="612" stroke="#6b7280" stroke-width="2"/>
<line x1="930" y1="612" x2="880" y2="656" stroke="#6b7280" stroke-width="2"/>
<line x1="930" y1="612" x2="980" y2="656" stroke="#6b7280" stroke-width="2"/>
<line x1="1090" y1="612" x2="1140" y2="656" stroke="#6b7280" stroke-width="2"/>
<line x1="1090" y1="612" x2="1040" y2="656" stroke="#6b7280" stroke-width="2"/>
<circle cx="1010" cy="568" r="15" fill="#fff" stroke="#111827" stroke-width="2"/>
<circle cx="930" cy="612" r="15" fill="#fff" stroke="#111827" stroke-width="2"/>
<circle cx="1090" cy="612" r="15" fill="#fef9c3" stroke="#111827" stroke-width="2"/>
<rect x="866" y="644" width="28" height="24" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<rect x="966" y="644" width="28" height="24" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<rect x="1026" y="644" width="28" height="24" rx="5" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<rect x="1126" y="644" width="28" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1010" y="573" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">1</text>
<text x="930" y="617" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">2</text>
<text x="1090" y="617" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">3</text>
<text x="1170" y="590" font-size="13" font-weight="700" fill="#4b5563" text-anchor="start">split order 1, 2, 3 ...</text>
<text x="1170" y="610" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">until 31 leaves or depth 6</text>
<text x="740" y="700" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">c) Early stopping (scikit-learn default for more than 10,000 rows): 10% of the training</text>
<text x="740" y="720" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">rows are held out, and boosting stops if their loss does not improve for 10 rounds.</text>
<text x="740" y="745" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">So 300 is a maximum: fewer trees may be kept.</text>
</svg>